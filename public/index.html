<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞书消息中心</title>
<style>
[data-theme="dark"], :root {
  --bg0: #0a0f1e;
  --bg1: #0f1629;
  --bg2: #162040;
  --bg3: #1e2d55;
  --accent: #4f8ef7;
  --accent2: #7fb3ff;
  --tx1: #e8edf8;
  --tx2: #8899bb;
  --tx3: #4d607a;
  --bubble-in: #1a2540;
  --bubble-out: #1a3a7a;
  --border: rgba(79,142,247,0.12);
  --success: #22c55e;
  --danger: #f87171;
}
[data-theme="light"] {
  --bg0: #f5f7fa;
  --bg1: #ffffff;
  --bg2: #e8ecf1;
  --bg3: #d0d7e0;
  --accent: #4f8ef7;
  --accent2: #6b9fff;
  --tx1: #1a1f2e;
  --tx2: #5a6a7a;
  --tx3: #8a96a6;
  --bubble-in: #e8ecf1;
  --bubble-out: #d0e0ff;
  --border: rgba(79,142,247,0.2);
  --success: #22c55e;
  --danger: #ef4444;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background:var(--bg0); color:var(--tx1); display:flex; flex-direction:column; overflow:hidden; }

.app { display:flex; height:100vh; }

/* ── Sidebar ── */
.sidebar { width:260px; background:var(--bg1); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.sidebar-header { padding:18px 16px 12px; border-bottom:1px solid var(--border); }
.sidebar-brand { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.sidebar-brand svg { opacity:0.85; }
.sidebar-brand h1 { font-size:15px; font-weight:600; letter-spacing:0.3px; }
.sidebar-actions { margin-left:auto; display:flex; gap:4px; }
.sidebar-actions button { background:none; border:none; color:var(--tx3); cursor:pointer; font-size:13px; padding:4px 6px; border-radius:5px; transition:background 0.15s, color 0.15s; }
.sidebar-actions button:hover { background:var(--bg2); color:var(--tx1); }
.status-bar { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--tx2); }
.dot { width:7px; height:7px; border-radius:50%; background:var(--danger); flex-shrink:0; transition:background 0.3s, box-shadow 0.3s; }
.dot.on { background:var(--success); box-shadow:0 0 6px var(--success); }

.sidebar-section { padding:10px 12px 4px; font-size:11px; color:var(--tx3); text-transform:uppercase; letter-spacing:0.8px; }
.conv-list { flex:1; overflow-y:auto; padding:4px 6px 6px; }
.conv-item { padding:10px 10px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:10px; transition:background 0.15s; position:relative; }
.conv-item:hover { background:var(--bg2); }
.conv-item.active { background:var(--bg3); }
.avatar { width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; flex-shrink:0; color:#fff; }
.conv-meta { flex:1; min-width:0; }
.conv-name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv-sub { font-size:11px; color:var(--tx2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge { background:var(--accent); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:10px; min-width:18px; text-align:center; }

.add-btn { margin:8px 12px 12px; padding:9px; background:transparent; border:1px dashed var(--border); border-radius:10px; color:var(--tx2); cursor:pointer; font-size:12px; font-family:inherit; transition:background 0.15s, color 0.15s; }
.add-btn:hover { background:var(--bg2); color:var(--accent2); border-color:var(--accent); }

/* ── Config panel ── */
.config { padding:10px 12px; border-bottom:1px solid var(--border); display:none; }
.config input { width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:6px 10px; color:var(--tx1); font-size:12px; outline:none; font-family:inherit; }
.config input:focus { border-color:var(--accent); }
.cfg-label { font-size:11px; color:var(--tx3); margin-top:6px; margin-bottom:3px; }
.cfg-row { display:flex; align-items:center; gap:8px; }
.cfg-row select { flex:1; background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:6px 10px; color:var(--tx1); font-size:12px; outline:none; font-family:inherit; cursor:pointer; }
.cfg-row select option { background:var(--bg1); }
.cfg-btn { margin-top:8px; width:100%; padding:7px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-size:12px; cursor:pointer; font-family:inherit; }

/* ── Chat ── */
.chat { flex:1; display:flex; flex-direction:column; min-width:0; }
.chat-header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; background:var(--bg1); }
.chat-header .avatar { width:34px; height:34px; font-size:13px; border-radius:8px; flex-shrink:0; }
.chat-header-info { flex:1; min-width:0; }
.hd-name { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hd-sub { font-size:11px; color:var(--tx2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-actions { display:flex; gap:8px; margin-left:auto; }
.chat-actions button { background:none; border:none; color:var(--tx3); cursor:pointer; padding:6px 8px; border-radius:6px; font-size:12px; transition:background 0.15s, color 0.15s; }
.chat-actions button:hover { background:var(--bg2); color:var(--tx1); }

.msgs { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; }
.msg { display:flex; gap:8px; align-items:flex-end; animation:slideUp 0.18s ease; }
@keyframes slideUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.msg.out { flex-direction:row-reverse; }
.msg .avatar { width:30px; height:30px; font-size:11px; border-radius:7px; flex-shrink:0; }
.bw { display:flex; flex-direction:column; max-width:62%; }
.msg.out .bw { align-items:flex-end; }
.bubble { padding:9px 13px; border-radius:12px; font-size:13.5px; line-height:1.55; word-break:break-word; white-space:pre-wrap; }
.msg.in .bubble { background:var(--bubble-in); border-bottom-left-radius:4px; }
.msg.out .bubble { background:var(--bubble-out); border-bottom-right-radius:4px; }
.msg-time { font-size:11px; color:var(--tx3); margin-top:4px; padding:0 3px; display:flex; align-items:center; gap:4px; }
.msg.out .msg-time { justify-content:flex-end; }

.read-tick { color:var(--accent2); font-size:11px; line-height:1; }
.read-tick.pending { color:var(--tx3); }

/* ── Input ── */
.input-wrap { padding:14px 18px; border-top:1px solid var(--border); background:var(--bg1); }
.input-row { display:flex; gap:10px; align-items:flex-end; }
.msg-input { flex:1; background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:10px 14px; color:var(--tx1); font-size:13.5px; resize:none; min-height:42px; max-height:120px; outline:none; font-family:inherit; line-height:1.5; transition:border-color 0.2s; }
.msg-input:focus { border-color:rgba(79,142,247,0.4); }
.msg-input::placeholder { color:var(--tx3); }
.send-btn { width:42px; height:42px; background:var(--accent); border:none; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background 0.15s, transform 0.1s; }
.send-btn:hover { background:var(--accent2); }
.send-btn:active { transform:scale(0.93); }
.send-btn:disabled { background:var(--bg3); cursor:not-allowed; }

/* ── Empty state ── */
.empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--tx3); }
.empty svg { opacity:0.18; }
.empty p { font-size:15px; font-weight:500; color:var(--tx2); }
.empty span { font-size:13px; }

/* ── Toasts ── */
.toasts { position:fixed; top:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:999; }
.toast { padding:10px 16px; border-radius:10px; font-size:12.5px; animation:toastIn 0.25s ease; box-shadow:0 4px 16px rgba(0,0,0,0.4); }
@keyframes toastIn { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }
.toast.ok { background:#14532d; color:#bbf7d0; }
.toast.err { background:#7f1d1d; color:#fecaca; }
.toast.info { background:#1e3a5f; color:#bfdbfe; }

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:2px; }

/* ── Theme icons ── */
.theme-icon { font-size:14px; line-height:1; }

/* ── Context Menu ── */
.context-menu {
  position: fixed;
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 0;
  min-width: 120px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  z-index: 1000;
  animation: fadeIn 0.1s ease;
}
@keyframes fadeIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
.context-menu-item {
  padding: 8px 16px;
  font-size: 13px;
  color: var(--tx1);
  cursor: pointer;
  transition: background 0.15s;
}
.context-menu-item:hover { background: var(--bg2); }
.context-menu-item.danger { color: var(--danger); }
.context-menu-item.danger:hover { background: rgba(248,113,113,0.1); }
.context-menu-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

/* ── Search Box ── */
.search-box {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  display: none;
}
.search-box input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  color: var(--tx1);
  font-size: 12px;
  outline: none;
}
.search-box input:focus { border-color: var(--accent); }
.search-highlight { background: rgba(79,142,247,0.3); border-radius: 2px; }

/* ── Scroll to Bottom Button ── */
.scroll-to-bottom {
  position: absolute;
  bottom: 80px;
  right: 20px;
  width: 40px;
  height: 40px;
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  transition: transform 0.15s, opacity 0.15s;
  opacity: 0;
  pointer-events: none;
}
.scroll-to-bottom.visible { opacity: 1; pointer-events: auto; }
.scroll-to-bottom:hover { transform: scale(1.05); }
.scroll-to-bottom .badge-count {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 10px;
  min-width: 16px;
  text-align: center;
}

/* ── Emoji Picker ── */
.emoji-picker {
  position: absolute;
  bottom: 60px;
  left: 18px;
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  display: none;
  z-index: 100;
}
.emoji-picker.visible { display: grid; }
.emoji-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 4px;
  max-height: 200px;
  overflow-y: auto;
}
.emoji-item {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
  border-radius: 6px;
  transition: background 0.15s;
}
.emoji-item:hover { background: var(--bg2); }

/* ── Image Preview ── */
.image-preview-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10000;
}
.image-preview-overlay.visible { display: flex; }
.image-preview-overlay img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 8px;
}
.image-preview-close {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 50%;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
}

/* ── Loading Spinner ── */
.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid transparent;
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <h1>飞书消息</h1>
        <div class="sidebar-actions">
          <button onclick="toggleConfig()" title="设置">⚙</button>
          <button onclick="cycleTheme()" id="themeBtn" title="切换主题">🌙</button>
        </div>
      </div>
      <div class="status-bar">
        <span class="dot" id="dot"></span>
        <span id="statusTx">连接中...</span>
      </div>
    </div>

    <!-- Config -->
    <div class="config" id="cfg">
      <div class="cfg-label">服务器地址</div>
      <input id="cfgUrl" placeholder="http://localhost:3000">
      <div class="cfg-label" style="margin-top:8px;">API Token（必填）</div>
      <input id="cfgToken" placeholder="你的 API 密钥">
      <div class="cfg-label" style="margin-top:8px;">默认 Chat ID</div>
      <input id="cfgChatId" placeholder="oc_xxxxxxxx">
      <div class="cfg-label" style="margin-top:8px;">主题</div>
      <div class="cfg-row">
        <select id="cfgTheme">
          <option value="system">跟随系统</option>
          <option value="light">白天</option>
          <option value="dark">黑夜</option>
        </select>
      </div>
      <button class="cfg-btn" onclick="applyConfig()">保存</button>
    </div>

    <!-- Search Box -->
    <div class="search-box" id="searchBox">
      <input type="text" id="searchInput" placeholder="搜索消息..." oninput="searchMessages(this.value)">
    </div>

    <div class="sidebar-section">
      会话 <span id="convCount" style="font-weight:normal;"></span>
      <button onclick="toggleSearch()" style="float:right;background:none;border:none;color:var(--tx3);cursor:pointer;font-size:11px;padding:0 4px;" title="搜索">🔍</button>
    </div>
    <div class="conv-list" id="convList"></div>
    <button class="add-btn" onclick="addConv()">＋ 添加会话</button>
  </div>

  <!-- Chat -->
  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>选择一个会话</p>
      <span>或添加飞书 Chat ID 开始聊天</span>
    </div>
    <div id="chatView" style="display:none;flex-direction:column;height:100%">
      <div class="chat-header">
        <div class="avatar" id="hdAvatar"></div>
        <div class="chat-header-info">
          <div class="hd-name" id="hdName">-</div>
          <div class="hd-sub" id="hdSub">-</div>
        </div>
        <div class="chat-actions">
          <button onclick="clearCurrentChat()" title="清空当前聊天记录">🗑</button>
          <button onclick="copyChatId()" title="复制 Chat ID">📋</button>
        </div>
      </div>
      <div class="msgs" id="msgs"></div>
      <!-- Emoji Picker -->
      <div class="emoji-picker" id="emojiPicker">
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>

      <div class="input-wrap">
        <div class="input-row">
          <button onclick="toggleEmojiPicker()" style="background:none;border:none;color:var(--tx3);cursor:pointer;font-size:18px;padding:8px;" title="表情">😊</button>
          <textarea class="msg-input" id="input" placeholder="输入消息… Enter 发送 · Shift+Enter 换行" rows="1"></textarea>
          <button class="send-btn" id="sendBtn" onclick="send()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white" id="sendIcon"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>

      <!-- Scroll to Bottom Button -->
      <div class="scroll-to-bottom" id="scrollToBottom" onclick="scrollToBottomAndClear()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--tx2)" stroke-width="2">
          <path d="M12 5v14M5 12l7 7 7-7"/>
        </svg>
        <span class="badge-count" id="newMsgCount" style="display:none;">0</span>
      </div>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<!-- Context Menu -->
<div class="context-menu" id="contextMenu" style="display:none;">
  <div class="context-menu-item" onclick="copyMessageText()">复制文本</div>
  <div class="context-menu-item" onclick="copyMessageId()">复制消息ID</div>
  <div class="context-menu-divider"></div>
  <div class="context-menu-item danger" onclick="deleteMessage()">删除消息</div>
</div>

<!-- Image Preview -->
<div class="image-preview-overlay" id="imagePreview" onclick="closeImagePreview()">
  <button class="image-preview-close" onclick="closeImagePreview(); event.stopPropagation();">×</button>
  <img id="previewImg" src="" alt="预览">
</div>

<script>
const S = {
  url: localStorage.getItem('relayUrl') || location.origin,
  token: localStorage.getItem('relayToken') || '',
  theme: 'system',
  convs: [],
  msgs: {},
  msgEls: {},
  cur: null,
  es: null,
  connected: false,
  contextMenuTarget: null,
  newMsgCount: 0,
  isNearBottom: true,
  drafts: {},
};

// 从服务端加载数据
async function loadFromServer() {
  console.log('[前端] loadFromServer() 被调用');
  if (!S.token) {
    console.warn('[前端] loadFromServer() 没有 token，跳过');
    return;
  }
  try {
    console.log('[前端] 从服务端加载数据...');
    const [convsRes, draftsRes, settingsRes] = await Promise.all([
      fetch(`${S.url}/api/convs?token=${encodeURIComponent(S.token)}`),
      fetch(`${S.url}/api/drafts?token=${encodeURIComponent(S.token)}`),
      fetch(`${S.url}/api/settings?token=${encodeURIComponent(S.token)}`),
    ]);
    const convsData = await convsRes.json();
    const draftsData = await draftsRes.json();
    const settingsData = await settingsRes.json();
    console.log('[前端] 会话列表:', convsData);
    console.log('[前端] 草稿:', draftsData);
    console.log('[前端] 设置:', settingsData);
    if (convsData.ok) S.convs = convsData.data;
    if (draftsData.ok) S.drafts = draftsData.data;
    if (settingsData.ok) S.theme = settingsData.data.theme || 'system';
    console.log('[前端] 数据加载完成，S.convs=', S.convs, 'S.drafts=', S.drafts, 'S.theme=', S.theme);
  } catch (err) {
    console.error('[前端] 加载服务端数据失败:', err);
  }
}

document.getElementById('cfgUrl').value = S.url;
document.getElementById('cfgToken').value = S.token;
document.getElementById('cfgChatId').value = localStorage.getItem('defaultChatId') || '';
document.getElementById('cfgTheme').value = S.theme;

// 初始化：先加载服务端数据，再初始化界面
async function init() {
  await loadFromServer();
  document.getElementById('cfgTheme').value = S.theme;
  initTheme();
  initEmojiPicker();
  renderConvs();
  if (S.token) connect();
}
init();

// Close context menu on click elsewhere
document.addEventListener('click', () => {
  document.getElementById('contextMenu').style.display = 'none';
});

// Close emoji picker on click elsewhere
document.addEventListener('click', (e) => {
  if (!e.target.closest('.emoji-picker') && !e.target.closest('[onclick="toggleEmojiPicker()"]')) {
    document.getElementById('emojiPicker').classList.remove('visible');
  }
});

// Scroll detection for scroll-to-bottom button
const msgsContainer = document.getElementById('msgs');
if (msgsContainer) {
  msgsContainer.addEventListener('scroll', () => {
    const threshold = 100;
    const isBottom = msgsContainer.scrollHeight - msgsContainer.scrollTop - msgsContainer.clientHeight < threshold;
    S.isNearBottom = isBottom;
    if (isBottom) {
      document.getElementById('scrollToBottom').classList.remove('visible');
      S.newMsgCount = 0;
      document.getElementById('newMsgCount').style.display = 'none';
    }
  });
}

function initTheme() {
  const stored = S.theme;
  if (stored === 'system') {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = prefersDark ? 'dark' : 'light';
  } else {
    document.documentElement.dataset.theme = stored;
  }
  updateThemeBtn();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    if (S.theme === 'system') {
      document.documentElement.dataset.theme = e.matches ? 'dark' : 'light';
      updateThemeBtn();
    }
  });
}

function updateThemeBtn() {
  const btn = document.getElementById('themeBtn');

async function saveSettings() {
  console.log('[前端] saveSettings() 被调用，主题:', S.theme);
  if (!S.token) {
    console.warn('[前端] saveSettings() 没有 token，跳过');
    return;

  try {
    const res = await fetch(`${S.url}/api/settings?token=${encodeURIComponent(S.token)}`, {
      method: 'POST',

      body: JSON.stringify({ theme: S.theme }),
    });

async function cycleTheme() {
  const themes = ['system', 'light', 'dark'];
  const idx = themes.indexOf(S.theme);
  S.theme = themes[(idx + 1) % themes.length];
  await saveSettings();
  document.getElementById('cfgTheme').value = S.theme;
  initTheme();
  toast(`主题: ${S.theme === 'system' ? '跟随系统' : S.theme === 'light' ? '白天' : '黑夜'}`, 'info');

// ── SSE ───────────────────────────────────────────────────────
async function connect() {
  if (!S.token) {
    toast('请先配置 API Token', 'err');
    return;
  }
  
  // 连接前先从服务端加载数据
  await loadFromServer();
  document.getElementById('cfgTheme').value = S.theme;
  initTheme();
  renderConvs();
  
  if (S.es) { try { S.es.close(); } catch{} }
  const es = new EventSource(`${S.url}/api/events?token=${encodeURIComponent(S.token)}`);
  S.es = es;

  es.addEventListener('connected', () => setStatus(true));
  es.addEventListener('message', e => onMsg(JSON.parse(e.data)).catch(console.error));
  es.addEventListener('history', e => {
    const msgs = JSON.parse(e.data);
    (async () => {
      for (const m of msgs) {
        await onMsg(m, true);
      }
    })().catch(console.error);
  });
  es.addEventListener('read', e => onReadReceipt(JSON.parse(e.data)));
  es.onerror = () => { setStatus(false); setTimeout(connect, 3000); };
}

function setStatus(ok) {
  S.connected = ok;
  document.getElementById('dot').className = 'dot' + (ok ? ' on' : '');
  document.getElementById('statusTx').textContent = ok ? '已连接' : '重连中…';
}

// ── 已读回执处理 ──────────────────────────────────────────────
function onReadReceipt(data) {
  (data.messageIds || []).forEach(msgId => {
    const el = S.msgEls[msgId];
    if (!el) return;
    const tick = el.querySelector('.read-tick');
    if (tick) {
      tick.textContent = '✓✓';
      tick.classList.remove('pending');
      tick.title = `已读 ${data.readerId || ''}`;
    }
  });
}

// ── 消息处理 ──────────────────────────────────────────────────
async function onMsg(msg, isHistory = false) {
  if (!msg.chatId) return;
  if (!S.msgs[msg.chatId]) S.msgs[msg.chatId] = [];
  if (msg.id && S.msgs[msg.chatId].find(m => m.id === msg.id)) return;
  S.msgs[msg.chatId].push(msg);

  let conv = S.convs.find(c => c.id === msg.chatId);
  if (!conv) {
    conv = {
      id: msg.chatId,
      name: msg.chatType === 'p2p' ? '用户 ' + (msg.senderId || '').slice(-6) : '群聊 ' + msg.chatId.slice(-6),
      type: msg.chatType || 'group',
      unread: 0,
    };
    S.convs.push(conv);
    await saveConvs();
  }
  if (!isHistory && msg.chatId !== S.cur) {
    conv.unread = (conv.unread || 0) + 1;
    await saveConvs();
  }
  renderConvs();
  if (msg.chatId === S.cur) {
    appendMsg(msg);
    if (isHistory) {
      scrollBottom();
    } else if (S.isNearBottom) {
      scrollBottom();
    } else {
      S.newMsgCount++;
      document.getElementById('newMsgCount').textContent = S.newMsgCount;
      document.getElementById('newMsgCount').style.display = 'block';
      document.getElementById('scrollToBottom').classList.add('visible');
    }
  }
}

// ── Conversations ─────────────────────────────────────────────
function renderConvs() {
  document.getElementById('convList').innerHTML = S.convs.map(c => `
    <div class="conv-item${c.id===S.cur?' active':''}" onclick="selectConv('${c.id}')" oncontextmenu="showConvContextMenu(event, '${c.id}')">
      <div class="avatar" style="background:${strColor(c.id)}">${c.name[0]}</div>
      <div class="conv-meta">
        <div class="conv-name">${esc(c.name)}</div>
        <div class="conv-sub">${c.type==='p2p'?'私聊':'群聊'}</div>
      </div>
      ${c.unread ? `<div class="badge">${c.unread}</div>` : ''}
    </div>`).join('');
  document.getElementById('convCount').textContent = `(${S.convs.length})`;
}

// ── 搜索功能 ──────────────────────────────────────────────────
function toggleSearch() {
  const box = document.getElementById('searchBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
  if (box.style.display === 'block') {
    document.getElementById('searchInput').focus();
  } else {
    document.getElementById('searchInput').value = '';
    searchMessages('');
  }
}

function searchMessages(query) {
  if (!S.cur || !query) {
    document.querySelectorAll('.msg').forEach(el => {
      el.style.display = 'flex';
      const bubble = el.querySelector('.bubble');
      if (bubble) bubble.innerHTML = bubble.innerHTML.replace(/<span class="search-highlight">(.*?)<\/span>/g, '$1');
    });
    return;
  }
  const msgs = S.msgs[S.cur] || [];
  document.querySelectorAll('.msg').forEach((el, idx) => {
    const msg = msgs[idx];
    if (!msg) return;
    const text = extractText(msg).toLowerCase();
    if (text.includes(query.toLowerCase())) {
      el.style.display = 'flex';
      const bubble = el.querySelector('.bubble');
      if (bubble) {
        const txt = extractText(msg);
        const regex = new RegExp(`(${escRegex(query)})`, 'gi');
        bubble.innerHTML = esc(txt).replace(regex, '<span class="search-highlight">$1</span>');
      }
    } else {
      el.style.display = 'none';
    }
  });
}

function escRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ── 右键菜单 ──────────────────────────────────────────────────
function showContextMenu(event, msgId) {
  event.preventDefault();
  S.contextMenuTarget = msgId;
  const menu = document.getElementById('contextMenu');
  menu.style.display = 'block';
  menu.style.left = Math.min(event.pageX, window.innerWidth - 150) + 'px';
  menu.style.top = Math.min(event.pageY, window.innerHeight - 100) + 'px';
}

function showConvContextMenu(event, convId) {
  event.preventDefault();
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.style.cssText = `position:fixed;left:${event.pageX}px;top:${event.pageY}px;z-index:1000;display:block;`;
  menu.innerHTML = `
    <div class="context-menu-item" onclick="renameConv('${convId}')">重命名</div>
    <div class="context-menu-item danger" onclick="deleteConv('${convId}')">删除会话</div>
  `;
  document.body.appendChild(menu);
  const closeMenu = () => { menu.remove(); document.removeEventListener('click', closeMenu); };
  setTimeout(() => document.addEventListener('click', closeMenu), 0);
}

function copyMessageText() {
  if (!S.contextMenuTarget || !S.cur) return;
  const msg = S.msgs[S.cur].find(m => m.id === S.contextMenuTarget);
  if (msg) {
    navigator.clipboard.writeText(extractText(msg)).then(() => toast('文本已复制', 'ok'));
  }
  document.getElementById('contextMenu').style.display = 'none';
}

function copyMessageId() {
  if (!S.contextMenuTarget) return;
  navigator.clipboard.writeText(S.contextMenuTarget).then(() => toast('消息ID已复制', 'ok'));
  document.getElementById('contextMenu').style.display = 'none';
}

function deleteMessage() {
  if (!S.contextMenuTarget || !S.cur) return;
  if (!confirm('确定删除这条消息？')) return;
  S.msgs[S.cur] = S.msgs[S.cur].filter(m => m.id !== S.contextMenuTarget);
  const el = S.msgEls[S.contextMenuTarget];
  if (el) el.remove();
  delete S.msgEls[S.contextMenuTarget];
  toast('消息已删除', 'ok');
  document.getElementById('contextMenu').style.display = 'none';
}

async function renameConv(convId) {
  const conv = S.convs.find(c => c.id === convId);
  if (!conv) return;
  const newName = prompt('新名称:', conv.name);
  if (newName && newName.trim()) {
    conv.name = newName.trim();
    await saveConvs();
    renderConvs();
    if (S.cur === convId) {
      document.getElementById('hdName').textContent = conv.name;
    }
  }
}

async function deleteConv(convId) {
  if (!confirm('确定删除这个会话？聊天记录将保留。')) return;
  S.convs = S.convs.filter(c => c.id !== convId);
  await saveConvs();
  renderConvs();
  if (S.cur === convId) {
    S.cur = null;
    document.getElementById('chatView').style.display = 'none';
    document.getElementById('empty').style.display = 'flex';
  }
}

// ── Draft Save ────────────────────────────────────────────────
async function saveDraft() {
  console.log('[前端] saveDraft() 被调用，数据:', S.drafts);
  if (S.cur) {
    S.drafts[S.cur] = document.getElementById('input').value;
    if (!S.token) {
      console.warn('[前端] saveDraft() 没有 token，跳过');
      return;
    }
    try {
      const res = await fetch(`${S.url}/api/drafts?token=${encodeURIComponent(S.token)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': S.token },
        body: JSON.stringify(S.drafts),
      });
      const data = await res.json();
      console.log('[前端] saveDraft() 返回:', data);
    } catch (err) {
      console.error('[前端] 保存草稿失败:', err);
    }
  }
}

function loadDraft() {
  if (S.cur && S.drafts[S.cur]) {
    document.getElementById('input').value = S.drafts[S.cur];
    adjustTA(document.getElementById('input'));
  }
}

async function selectConv(id) {
  // Save draft of previous conversation
  await saveDraft();
  
  S.cur = id;
  const c = S.convs.find(x=>x.id===id);
  if (c) c.unread = 0;
  await saveConvs(); renderConvs();

  document.getElementById('empty').style.display = 'none';
  const cv = document.getElementById('chatView');
  cv.style.display = 'flex';
  document.getElementById('hdAvatar').textContent = c?.name[0] || '?';
  document.getElementById('hdAvatar').style.background = strColor(id);
  document.getElementById('hdName').textContent = c?.name || id;
  document.getElementById('hdSub').textContent = (c?.type==='p2p'?'私聊':'群聊') + ' · ' + id;

  const el = document.getElementById('msgs');
  el.innerHTML = '';
  S.msgEls = {};
  (S.msgs[id]||[]).forEach(appendMsg);
  scrollBottom();
  
  // Load draft for new conversation
  document.getElementById('input').value = '';
  loadDraft();
  document.getElementById('input').focus();
}

async function addConv() {
  const id = prompt('输入飞书 Chat ID\n（私聊: ou_xxx，群聊: oc_xxx）');
  if (!id?.trim()) return;
  const name = prompt('会话名称:') || id.slice(0,12);
  const type = id.startsWith('oc_') ? 'group' : 'p2p';
  if (!S.convs.find(c=>c.id===id)) {
    S.convs.push({ id, name, type, unread:0 });
    await saveConvs(); renderConvs();
  }
  await selectConv(id);
}

async function saveConvs() {
  console.log('[前端] saveConvs() 被调用，数据:', S.convs);
  if (!S.token) {
    console.warn('[前端] saveConvs() 没有 token，跳过');
    return;
  }
  try {
    const res = await fetch(`${S.url}/api/convs?token=${encodeURIComponent(S.token)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': S.token },
      body: JSON.stringify(S.convs),
    });
    const data = await res.json();
    console.log('[前端] saveConvs() 返回:', data);
  } catch (err) {
    console.error('[前端] 保存会话列表失败:', err);
  }
}

function clearCurrentChat() {
  if (!S.cur) return;
  if (!confirm('确定清空当前聊天记录？')) return;
  S.msgs[S.cur] = [];
  document.getElementById('msgs').innerHTML = '';
  S.msgEls = {};
  toast('聊天记录已清空', 'ok');
}

function copyChatId() {
  if (!S.cur) return;
  navigator.clipboard.writeText(S.cur).then(() => toast('Chat ID 已复制', 'ok'));
}

// ── 渲染单条消息 ──────────────────────────────────────────────
function appendMsg(msg) {
  const el = document.getElementById('msgs');
  if (!el) return;
  const out = msg.direction === 'outgoing';
  const txt = extractText(msg);
  const t = fmtTime(msg.createTime);

  const d = document.createElement('div');
  d.className = `msg ${out?'out':'in'}`;
  if (msg.id) d.dataset.msgId = msg.id;
  
  // Add right-click context menu
  if (msg.id) {
    d.oncontextmenu = (e) => showContextMenu(e, msg.id);
  }

  const tickHtml = out ? `<span class="read-tick pending" title="已发送">✓</span>` : '';

  d.innerHTML = `
    <div class="avatar" style="background:${out?'#2d1b69':'#0f2a5c'}">${out?'我':'对'}</div>
    <div class="bw">
      <div class="bubble">${esc(txt)}</div>
      <div class="msg-time">${t}${tickHtml}</div>
    </div>`;

  el.appendChild(d);
  if (msg.id) S.msgEls[msg.id] = d;
}

function scrollBottom() {
  const el = document.getElementById('msgs');
  if (el) requestAnimationFrame(()=>el.scrollTop=el.scrollHeight);
}

// ── 发送消息 ──────────────────────────────────────────────────
async function send() {
  const inp = document.getElementById('input');
  const txt = inp.value.trim();
  if (!txt || !S.cur) return;
  
  const btn = document.getElementById('sendBtn');
  
  // 防止重复发送
  if (btn.disabled) return;
  
  // Show loading state
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';
  
  const draft = txt;
  inp.value = ''; adjustTA(inp);
  
  // Clear draft after sending
  if (S.drafts[S.cur]) {
    delete S.drafts[S.cur];
    await saveDraft();
  }
  
  try {
    const r = await fetch(`${S.url}/api/send`, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': S.token
      },
      body:JSON.stringify({ chatId:S.cur, message:draft }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
  } catch(e) {
    toast(e.message, 'err');
    inp.value = draft;
    adjustTA(inp);
  } finally {
    // Restore button
    btn.disabled = false;
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="white" id="sendIcon"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>';
    inp.focus();
  }
}

}

// ── Utils ─────────────────────────────────────────────────────
function extractText(msg) {
  try {
    const c = msg.content;
    if (!c) return '[消息]';
    if (typeof c === 'string') return c;
    if (c.text) return c.text;
    if (Array.isArray(c.content)) return c.content.flat().map(i=>i.text||'').join('');
    return JSON.stringify(c);
  } catch { return '[消息]'; }
}

function fmtTime(ts) {
  if (!ts) return '';
  const raw = typeof ts === 'number' ? ts : Number(ts);
  const d = new Date(raw > 1e12 ? raw : raw * 1000);
  if (Number.isNaN(d.getTime())) return '';

  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.floor((startOfToday - startOfDate) / 86400000);
  const time = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });

  if (diffDays === 0) return time;
  if (diffDays === 1) return `昨天 ${time}`;
  if (d.getFullYear() === now.getFullYear()) {
    return `${d.getMonth() + 1}月${d.getDate()}日 ${time}`;
  }
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${time}`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function strColor(s) {
  let h=0; for(let c of s) h=c.charCodeAt(0)+((h<<5)-h);
  return ['#1a3a7a','#2d1b69','#0f3d30','#3d2200','#3d0a0a','#1a2d3d'][Math.abs(h)%6];
}

function toast(msg, type='info') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className=`toast ${type}`; t.textContent=msg;
  c.appendChild(t); setTimeout(()=>t.remove(),3000);
}

function adjustTA(el) {
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('input').addEventListener('input', function(){ adjustTA(this); });

// Save draft on page unload (使用同步请求确保数据保存)
window.addEventListener('beforeunload', () => {
  if (S.cur && S.token) {
    S.drafts[S.cur] = document.getElementById('input').value;
    const data = JSON.stringify(S.drafts);
    const url = `${S.url}/api/drafts?token=${encodeURIComponent(S.token)}`;
    // 使用同步 XMLHttpRequest 确保在页面关闭前完成保存
    try {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url, false);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('x-api-key', S.token);
      xhr.send(data);
    } catch (e) {
      console.error('页面卸载时保存草稿失败:', e);
    }
  }
});
