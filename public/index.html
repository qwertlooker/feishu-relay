<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞书消息中心</title>
<meta name="app-version" content="1.1.0">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <h1>飞书消息</h1>
        <button class="version-alert" id="versionAlert" type="button" onclick="refreshForUpdate()" title="点击刷新到服务器最新版本">有新版本，请刷新</button>
        <div class="sidebar-actions">
          <button onclick="toggleConfig()" title="设置">⚙</button>
          <button onclick="cycleTheme()" id="themeBtn" title="切换主题">🌙</button>
        </div>
      </div>
      <div class="status-bar">
        <span class="dot" id="dot"></span>
        <span id="statusTx">连接中...</span>
      </div>
    </div>

    <!-- Config -->
    <div class="config" id="cfg">
      <div class="cfg-label">服务器地址</div>
      <input id="cfgUrl" placeholder="http://localhost:3000">
      <div class="cfg-label" style="margin-top:8px;">API Token（必填）</div>
      <input id="cfgToken" placeholder="你的 API 密钥">
      <div class="cfg-label" style="margin-top:8px;">默认 Chat ID</div>
      <input id="cfgChatId" placeholder="oc_xxxxxxxx">
      <div class="cfg-label" style="margin-top:8px;">主题</div>
      <div class="cfg-row">
        <select id="cfgTheme">
          <option value="system">跟随系统</option>
          <option value="light">白天</option>
          <option value="dark">黑夜</option>
        </select>
      </div>
      <button class="cfg-btn" onclick="applyConfig()">保存</button>
      <div class="version-details">
        <div><span>网页版本</span><code id="webVersion">--</code></div>
        <div><span>服务器版本</span><code id="serverVersion">查询中…</code></div>
        <button type="button" onclick="checkServerVersion()">查询版本</button>
      </div>
    </div>

    <!-- Search Box -->
    <div class="search-box" id="searchBox">
      <div class="search-input-row">
        <input type="search" id="searchInput" placeholder="搜索消息..." oninput="searchMessages(this.value)">
        <button type="button" onclick="closeSearch()" title="关闭搜索">×</button>
      </div>
      <div class="search-options">
        <select id="searchScope" onchange="searchMessages(document.getElementById('searchInput').value)">
          <option value="all">全部会话</option>
          <option value="current">当前会话</option>
        </select>
        <span id="searchStatus">输入关键词搜索最近保存的消息</span>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="sidebar-section">
      会话 <span id="convCount" style="font-weight:normal;"></span>
      <button onclick="toggleSearch()" style="float:right;background:none;border:none;color:var(--tx3);cursor:pointer;font-size:11px;padding:0 4px;" title="搜索">🔍</button>
    </div>
    <div class="conv-list" id="convList"></div>
    <button class="add-btn" onclick="addConv()">＋ 添加会话</button>
  </div>

  <!-- Chat -->
  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>选择一个会话</p>
      <span>或添加飞书 Chat ID 开始聊天</span>
    </div>
    <div id="chatView" style="display:none;flex-direction:column;height:100%">
      <div class="chat-header">
        <div class="avatar" id="hdAvatar"></div>
        <div class="chat-header-info">
          <div class="hd-name" id="hdName">-</div>
          <div class="hd-sub" id="hdSub">-</div>
        </div>
        <div class="chat-actions">
          <button onclick="clearCurrentChat()" title="清空当前聊天记录">🗑</button>
          <button onclick="copyChatId()" title="复制 Chat ID">📋</button>
        </div>
      </div>
      <div class="msgs" id="msgs"></div>
      <!-- Emoji Picker -->
      <div class="emoji-picker" id="emojiPicker">
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>

      <div class="input-wrap">
        <div class="reply-bar" id="replyBar" style="display:none;">
          <div class="reply-bar-content">
            <strong>回复</strong>
            <span id="replyText"></span>
          </div>
          <button onclick="cancelReply()" title="取消回复">×</button>
        </div>
        <div class="input-row">
          <button onclick="toggleEmojiPicker()" style="background:none;border:none;color:var(--tx3);cursor:pointer;font-size:18px;padding:8px;" title="表情">😊</button>
          <button class="attach-btn" id="attachBtn" onclick="chooseAttachment()" title="发送图片或文件">📎</button>
          <input id="fileInput" type="file" hidden onchange="handleAttachment(this.files[0])">
          <textarea class="msg-input" id="input" placeholder="输入消息… Enter 发送 · Shift+Enter 换行" rows="1"></textarea>
          <button class="send-btn" id="sendBtn" onclick="send()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white" id="sendIcon"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>

      <!-- Scroll to Bottom Button -->
      <div class="scroll-to-bottom" id="scrollToBottom" onclick="scrollToBottomAndClear()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--tx2)" stroke-width="2">
          <path d="M12 5v14M5 12l7 7 7-7"/>
        </svg>
        <span class="badge-count" id="newMsgCount" style="display:none;">0</span>
      </div>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<!-- Context Menu -->
<div class="context-menu" id="contextMenu" style="display:none;">
  <div class="context-menu-item" id="replyMenuItem" onclick="replyMessage()">引用回复</div>
  <div class="context-menu-item" onclick="copyMessageText()">复制文本</div>
  <div class="context-menu-item" onclick="copyMessageId()">复制消息ID</div>
  <div class="context-menu-divider"></div>
  <div class="context-menu-item danger" id="withdrawMenuItem" onclick="withdrawMessage()">撤回消息</div>
  <div class="context-menu-item danger" onclick="deleteMessage()">从当前页面删除</div>
</div>

<!-- Image Preview -->
<div class="image-preview-overlay" id="imagePreview" onclick="closeImagePreview()">
  <button class="image-preview-close" onclick="closeImagePreview(); event.stopPropagation();">×</button>
  <img id="previewImg" src="" alt="预览">
</div>

<script src="/text-splitter.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
